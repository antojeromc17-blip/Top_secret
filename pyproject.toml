[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hider"
version = "0.1.0"
description = "Windows CLR Storage & Diagnostics Maintenance Utility"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout",
    "pyinstaller>=6.0.0",
]

[project.scripts]
hider = "hider.cli:app"
clrmon = "hider.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
